spring.application.name=avaliacao

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:avaliacaodb}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:senha}

spring.jpa.hibernate.ddl-auto=update

# Auth0
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER:https://SEU-TENANT.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://avaliacoes-api}
